server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Fully static: every route is a prerendered folder/index.html. Unknown paths get 404.html.
  location / { try_files $uri $uri/ =404; }
  error_page 404 /404.html;
  location ~* \.(js|css|woff2?|svg|png|ico)$ { expires 1y; add_header Cache-Control "public, immutable"; }
  location = /config.json { add_header Cache-Control "no-cache"; }
  location = /index.html  { add_header Cache-Control "no-cache"; }
}
